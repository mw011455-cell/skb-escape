<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결합의 관문</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C4923A;--gold2:#E8C97A;
  --navy:#0E1A35;--navy2:#1C2B5E;
  --cream:#F5EDD8;--cream2:#D9C9A8;
  --bg:#F0EAE0;--white:#fff;
  --green:#2E7D52;--red:#B03030;
}
body{font-family:'Pretendard',sans-serif;background:var(--bg);min-height:100vh;color:var(--navy)}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ══ INTRO ══ */
#intro{
  background:var(--navy);
  align-items:center;justify-content:center;
  padding:52px 24px 60px;text-align:center;
  position:relative;overflow:hidden;
}
#intro::before{
  content:'';position:absolute;
  bottom:0;left:50%;transform:translateX(-50%);
  width:600px;height:300px;
  background:radial-gradient(ellipse at center bottom, rgba(196,146,58,.18) 0%, transparent 70%);
  pointer-events:none;
}
.i-tag{font-size:11px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:18px;opacity:0;animation:up .6s .1s both}
.i-h1{font-family:'Pretendard',sans-serif;font-size:clamp(40px,9vw,68px);font-weight:900;color:#fff;line-height:1.1;margin-bottom:8px;opacity:0;animation:up .6s .25s both}
.i-h1 em{color:var(--gold);font-style:normal}
.i-sub{font-size:12px;letter-spacing:3px;color:var(--cream2);margin-bottom:44px;opacity:0;animation:up .6s .38s both}
.i-sphinx{
  width:380px;max-width:82vw;
  display:block;margin:0 auto 40px;
  filter:drop-shadow(0 20px 60px rgba(196,146,58,.45));
  opacity:0;animation:up .7s .52s both;
}
.i-copy{
  font-family:'Pretendard',sans-serif;font-size:15px;line-height:2;
  color:var(--cream2);max-width:400px;margin:0 auto 40px;
  opacity:0;animation:up .6s .68s both;
}
.i-copy strong{color:var(--gold2)}
.i-dots{display:flex;gap:8px;justify-content:center;margin-bottom:36px;opacity:0;animation:up .6s .8s both}
.i-dot{width:9px;height:9px;border-radius:50%;background:rgba(196,146,58,.2);border:1px solid rgba(196,146,58,.35)}
.btn-start{
  background:var(--gold);color:var(--navy);
  border:none;padding:18px 60px;
  font-family:'Pretendard',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;
  border-radius:6px;cursor:pointer;
  box-shadow:0 4px 28px rgba(196,146,58,.5);
  transition:.25s;opacity:0;animation:up .6s .92s both;
}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 36px rgba(196,146,58,.7)}

/* ══ HEADER ══ */
.ghdr{
  background:var(--navy);border-bottom:2px solid var(--gold);
  padding:13px 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:99;
}
.ghdr-l{font-family:'Pretendard',sans-serif;font-size:14px;color:var(--gold);letter-spacing:2px}
.ghdr-pips{display:flex;gap:5px}
.pip{width:26px;height:3px;border-radius:2px;background:rgba(196,146,58,.2);transition:.3s}
.pip.done{background:var(--gold)}
.pip.cur{background:#E5682A}
.ghdr-r{font-size:14px;color:var(--cream2);letter-spacing:1px}

/* ══ GAME BODY ══ */
.gbody{flex:1;padding:28px 20px 64px;max-width:580px;margin:0 auto;width:100%}

/* 스핑크스 말풍선 */
.srow{display:flex;gap:14px;align-items:flex-end;margin-bottom:26px}
.savatar{
  width:68px;height:68px;border-radius:50%;
  border:2px solid var(--gold);flex-shrink:0;
  overflow:hidden;background:var(--navy);
  display:flex;align-items:center;justify-content:center;
}
.savatar img{width:100%;height:100%;object-fit:cover;object-position:center top;}
.sbubble{font-size:15px;
  flex:1;background:var(--navy);color:var(--cream);
  border:1px solid rgba(196,146,58,.3);border-radius:12px 12px 12px 3px;
  padding:13px 17px;font-family:'Pretendard',sans-serif;font-size:13.5px;line-height:1.75;
}

.gate-h{font-family:'Pretendard',sans-serif;font-size:19px;font-weight:900;color:var(--navy);margin-bottom:4px}
.gate-t{font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:22px}

/* ══ 퀴즈 ══ */
.qcard{background:var(--white);border-radius:12px;padding:26px;box-shadow:0 2px 20px rgba(0,0,0,.07);border:1px solid rgba(196,146,58,.12);margin-bottom:16px}
.qq{font-family:'Pretendard',sans-serif;font-size:18px;line-height:1.8;color:var(--navy);margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font-size:16px;
  background:#F9F5EE;border:1.5px solid #DDD3BC;border-radius:8px;
  padding:13px 16px;cursor:pointer;font-size:16px;color:var(--navy);
  display:flex;align-items:center;gap:12px;text-align:left;transition:.2s;
}
.opt:hover{border-color:var(--gold);background:#FBF5E6}
.opt.correct{border-color:var(--green);background:#EBF5EF;color:var(--green)}
.opt.wrong{border-color:var(--red);background:#FAEBEB;color:var(--red)}
.opt.disabled{pointer-events:none}
.olbl{
  width:26px;height:26px;border-radius:50%;background:#E8DFC8;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:var(--navy2);
}

/* ══ 빈칸 채우기 ══ */
.fcard{background:var(--white);border-radius:12px;padding:26px;box-shadow:0 2px 20px rgba(0,0,0,.07);border:1px solid rgba(196,146,58,.12);margin-bottom:16px}
.fq{font-family:'Pretendard',sans-serif;font-size:15px;line-height:1.8;color:var(--navy);margin-bottom:16px}
.sbox{background:#F4EFE4;border-left:3px solid var(--gold);border-radius:4px 8px 8px 4px;padding:14px 18px;margin-bottom:18px}
.srow2{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #D4C4A0;font-size:15px}
.srow2:last-child{border-bottom:none}
.sn{color:#666}.sp{font-weight:700;color:var(--navy2)}
.ffields{display:flex;flex-direction:column;gap:12px}
.frow{display:flex;align-items:center;gap:10px}
.flbl{font-size:15px;color:#777;min-width:90px;white-space:nowrap}
.finput{font-size:16px;
  flex:1;background:#F9F5EE;border:1.5px solid #DDD3BC;border-radius:8px;
  padding:11px 14px;font-size:16px;color:var(--navy);text-align:right;
  font-family:'Pretendard',sans-serif;outline:none;transition:.2s;
}
.finput:focus{border-color:var(--gold);background:#FBF5E6}
.finput.correct{border-color:var(--green);background:#EBF5EF}
.finput.wrong{border-color:var(--red);background:#FAEBEB}
.funit{font-size:15px;color:#999;white-space:nowrap}

/* ══ 카드 뒤집기 ══ */
.flipwrap{margin-bottom:16px}
.flip-notice{font-size:15px;color:#888;text-align:center;margin-bottom:18px;line-height:1.6}
.cgrid{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
.fc{perspective:600px;cursor:pointer}
.fi{position:relative;width:100%;padding-top:130%;transform-style:preserve-3d;transition:.45s}
.fc.flipped .fi{transform:rotateY(180deg)}
.ff,.fb{font-size:14px;
  position:absolute;inset:0;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;padding:8px;text-align:center;
  font-size:11.5px;line-height:1.4;
}
.ff{font-size:28px;
  background:var(--navy2);border:1.5px solid rgba(196,146,58,.4);
  font-family:'Pretendard',sans-serif;font-size:26px;font-weight:900;color:rgba(196,146,58,.5);
}
.fb{background:var(--white);border:1.5px solid #DDD3BC;color:var(--navy);transform:rotateY(180deg)}
.fc.matched .ff,.fc.matched .fb{border-color:var(--green);background:#EBF5EF;color:var(--green)}
.mdone{display:none;text-align:center;font-family:'Pretendard',sans-serif;font-size:16px;color:var(--green);padding:16px}
.mdone.show{display:block;animation:up .4s both}

/* ══ 피드백 ══ */
.fb-box{border-radius:10px;padding:14px 18px;font-family:'Pretendard',sans-serif;font-size:16px;line-height:1.7;margin-bottom:14px;display:none}
.fb-box.ok{background:#EBF5EF;border:1px solid rgba(46,125,82,.35);color:#1E5E3A;display:block}
.fb-box.ng{background:#FAEBEB;border:1px solid rgba(176,48,48,.35);color:#7A2020;display:block}

/* ══ 버튼 ══ */
.btn-check{
  width:100%;background:var(--navy);color:var(--gold);
  border:1.5px solid var(--gold);padding:16px;
  font-family:'Pretendard',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;
  border-radius:8px;cursor:pointer;transition:.25s;margin-bottom:10px;
}
.btn-check:hover{background:var(--gold);color:var(--navy)}
.btn-check:disabled{opacity:.4;cursor:not-allowed}
.btn-next{
  width:100%;background:transparent;color:#999;
  border:1.5px solid #CCC;padding:14px;
  font-family:'Pretendard',sans-serif;font-size:14px;
  border-radius:8px;cursor:pointer;transition:.25s;display:none;
}
.btn-next:hover{border-color:var(--navy);color:var(--navy)}
.btn-next.show{display:block}

/* ══ CLEAR ══ */
#clear{
  background:var(--navy);
  align-items:center;justify-content:center;
  padding:52px 24px;text-align:center;
}
.cl-tag{font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:14px;animation:up .7s .2s both}
.cl-h{font-family:'Pretendard',sans-serif;font-size:clamp(28px,6vw,48px);font-weight:900;color:#fff;line-height:1.2;margin-bottom:6px;animation:up .7s .35s both}
.cl-h em{color:var(--gold);font-style:normal}
.cl-sub{font-size:13px;letter-spacing:2px;color:var(--cream2);margin-bottom:32px;animation:up .7s .48s both}
.cl-sphinx{width:200px;filter:drop-shadow(0 0 36px rgba(196,146,58,.5));margin-bottom:28px;animation:up .7s .6s both}
.cl-msg{max-width:400px;font-family:'Pretendard',sans-serif;font-size:15px;line-height:1.9;color:var(--cream2);margin-bottom:32px;animation:up .7s .75s both}
.cl-stats{display:flex;gap:20px;margin-bottom:36px;animation:up .7s .9s both}
.stat{background:rgba(196,146,58,.1);border:1px solid rgba(196,146,58,.3);border-radius:10px;padding:16px 28px;text-align:center}
.stat-n{font-family:'Pretendard',sans-serif;font-size:30px;font-weight:900;color:var(--gold);display:block}
.stat-l{font-size:11px;color:var(--cream2);letter-spacing:1px;display:block;margin-top:4px}
.btn-retry{
  background:transparent;border:1.5px solid rgba(245,237,216,.25);color:var(--cream2);
  padding:13px 32px;border-radius:8px;cursor:pointer;
  font-family:'Pretendard',sans-serif;font-size:13px;transition:.25s;
  animation:up .7s 1.05s both;
}
.btn-retry:hover{border-color:var(--cream2);color:#fff}

@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.cgrid{grid-template-columns:repeat(3,1fr)}.cl-stats{gap:10px}.stat{padding:12px 16px}}

/* ══ 문 열림 오버레이 ══ */
.door-overlay{
  position:fixed;inset:0;z-index:999;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;
}
.door-overlay.show{pointer-events:all;animation:overlayIn .3s both}
.door-left,.door-right{
  position:absolute;top:0;bottom:0;width:50%;
  background:var(--navy);
  display:flex;align-items:center;justify-content:center;
}
.door-left{
  left:0;border-right:3px solid var(--gold);
  transform-origin:left center;
}
.door-right{
  right:0;border-left:3px solid var(--gold);
  transform-origin:right center;
}
.door-overlay.open .door-left{animation:openLeft .7s .2s both}
.door-overlay.open .door-right{animation:openRight .7s .2s both}
.door-text{
  position:relative;z-index:2;text-align:center;
  animation:doorTextIn .35s .35s both;
}
.door-text .dt1{
  font-family:'Pretendard',sans-serif;font-size:18px;font-weight:700;
  color:var(--gold);letter-spacing:3px;margin-bottom:12px;
}
.door-text .dt2{
  font-family:'Pretendard',sans-serif;font-size:clamp(28px,6vw,48px);font-weight:900;
  color:#fff;letter-spacing:2px;
}
.door-text .dt3{
  font-size:14px;color:var(--cream2);letter-spacing:2px;margin-top:8px;
}
.door-deco{
  position:absolute;
  width:60px;height:60px;border:2px solid rgba(196,146,58,.3);border-radius:50%;
}
.door-deco.tl{top:20%;left:20%}
.door-deco.tr{top:20%;right:20%}
.door-deco.bl{bottom:20%;left:20%}
.door-deco.br{bottom:20%;right:20%}

@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes openLeft{to{transform:rotateY(-90deg)}}
@keyframes openRight{to{transform:rotateY(90deg)}}
@keyframes doorTextIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* 정답 파티클 */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:998;overflow:hidden}
.confetti-piece{
  position:absolute;top:-20px;width:10px;height:10px;border-radius:2px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  to{transform:translateY(110vh) rotate(720deg);opacity:0}
}
</style>
</head>

<script>

   speech:'요즘가족결합, 상품별 할인금액을 알아야 시작할 수 있다. 짝을 맞춰라.',
   pairs:[{a:'기가인터넷',b:'-13,200원'},{a:'기가라이트인터넷',b:'-11,000원'},{a:'광랜인터넷',b:'-4,400원'},{a:'휴대폰 1회선',b:'-3,500원'},{a:'휴대폰 2회선',b:'-7,000원'},{a:'B tv',b:'-1,100원'}]},
  {type:'quiz',title:'관문 2 — 기본 조건',tl:'객관식 · 단일 정답',
   speech:'요즘가족결합, 아무나 신청할 수 있는 게 아니다. 필수 조합을 알고 있는가?',
   q:'요즘가족결합을 신청하려면 반드시 필요한 상품 조합은?',
   opts:['휴대폰 + B tv','휴대폰 + 인터넷','인터넷 + B tv','휴대폰만 있으면 됨'],ans:1,
   ex:'요즘가족결합은 휴대폰 + 인터넷이 반드시 포함되어야 한다. B tv는 선택 사항이다.'},
  {type:'quiz',title:'관문 3 — B tv 할인 구조',tl:'객관식 · 요즘우리집결합',
   speech:'인터넷과 B tv를 함께 묶으면 B tv 할인이 달라진다. 정확한 금액을 알고 있는가?',
   q:'인터넷 + B tv 요즘가족결합 시 B tv 할인 총액은?',
   opts:['1,100원','2,200원','3,300원','4,400원'],ans:2,
   ex:'기본 할인 1,100원 + 요즘우리집결합 추가 2,200원 = 총 3,300원 할인'},
  {type:'quiz',title:'관문 4 — 조합 계산',tl:'객관식 · 계산형',
   speech:'이제 직접 계산해야 한다. 기가인터넷과 휴대폰 2회선, 얼마가 할인되는가?',
   q:'기가인터넷 + 휴대폰 2회선 요즘가족결합 시 월 총 할인액은?',
   opts:['17,800원','20,200원','21,300원','23,000원'],ans:1,
   ex:'기가인터넷 13,200원 + 휴대폰 2회선 7,000원 (3,500×2) = 총 20,200원 할인'},
  {type:'quiz',title:'관문 5 — 심화 계산',tl:'객관식 · B tv 할인 구조 포함',
   speech:'이번엔 B tv가 포함된다. 요즘우리집결합 할인 구조를 잊지 않았겠지?',
   q:'기가라이트인터넷 + B tv + 휴대폰 3회선 요즘가족결합 시 월 총 할인액은?',
   opts:['28,000원','30,100원','32,300원','32,900원'],ans:2,
   ex:'기가라이트인터넷 11,000원 + B tv 3,300원 (요즘우리집결합, 1,100+2,200) + 휴대폰 3회선 18,000원 = 총 32,300원'},
  {type:'fill',title:'관문 6 — 실전 청구 계산',tl:'빈칸 채우기 · 실제 상품가 적용',
   speech:'이제 실제 상품 가격이 주어진다. 할인 후 고객이 실제로 내는 금액을 계산하시오.',
   scenario:[{n:'광랜인터넷와이파이',p:'23,100원'},{n:'B tv 스탠다드',p:'15,400원'},{n:'Smart 3 셋톱박스',p:'4,400원'},{n:'휴대폰 2회선',p:'—'},{n:'요즘가족결합 적용',p:''}],
   fields:[{l:'할인 총액',a:14700,h:'광랜 4,400 + B tv 3,300 + 휴대폰 2회선 7,000'},{l:'월 청구 금액',a:28200,h:'23,100 + 15,400 + 4,400 - 14,700'}]},
  {type:'fill',title:'관문 7 — 최종 관문',tl:'빈칸 채우기 · 종합 계산',
   speech:'마지막이다. 모든 구조를 동원해야 풀 수 있다. 집중하시오.',
   scenario:[{n:'기가인터넷와이파이',p:'39,600원'},{n:'B tv All',p:'18,700원'},{n:'AI 5 셋톱박스(케어형)',p:'5,500원'},{n:'휴대폰 4회선',p:'—'},{n:'요즘가족결합 적용',p:''}],
   fields:[{l:'할인 총액',a:40500,h:'기가인터넷 13,200 + B tv 3,300 + 휴대폰 4회선 24,000'},{l:'월 청구 금액',a:23300,h:'39,600 + 18,700 + 5,500 - 40,500'}]}
];

let cur=0,score=0,answered=false,flipped=[],matched=0,total=0,locked=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function startGame(){show('game');load(0)}
function reset(){score=0;cur=0;show('intro')}

function updateHdr(){
  document.getElementById('hdrGate').textContent=`관문 ${cur+1} / ${gates.length}`;
  document.getElementById('hdrScore').textContent=`점수 ${score}`;
  document.getElementById('hdrPips').innerHTML=gates.map((_,i)=>`<div class="pip${i<cur?' done':i===cur?' cur':''}"></div>`).join('');
}

function load(idx){
  cur=idx;answered=false;flipped=[];matched=0;locked=false;
  const g=gates[idx];updateHdr();
  document.getElementById('gateH').textContent=g.title;
  document.getElementById('gateT').textContent='';
  document.getElementById('speech').textContent=g.speech;
  const fb=document.getElementById('fbBox');fb.className='fb-box';fb.innerHTML='';
  const bn=document.getElementById('btnNext');bn.classList.remove('show');
  const bc=document.getElementById('btnCheck');
  document.getElementById('content').innerHTML='';
  if(g.type==='quiz'){bc.style.display='none';document.getElementById('content').innerHTML=buildQuiz(g)}
  else if(g.type==='flip'){bc.style.display='none';total=g.pairs.length;document.getElementById('content').innerHTML=buildFlip(g)}
  else{bc.style.display='block';bc.disabled=false;document.getElementById('content').innerHTML=buildFill(g)}
}

function buildQuiz(g){
  const L=['①','②','③','④'];
  return `<div class="qcard"><div class="qq">${g.q}</div><div class="opts">${g.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})" id="o${i}"><span class="olbl">${L[i]}</span>${o}</button>`).join('')}</div></div>`;
}
function pick(i){
  if(answered)return;answered=true;
  const g=gates[cur];
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));
  const fb=document.getElementById('fbBox');
  if(i===g.ans){
    document.getElementById('o'+i).classList.add('correct');
    score+=15;updateHdr();
    showConfetti();
    fb.className='fb-box ok';fb.textContent='관문 통과! ✓';
    setTimeout(()=>moveNext(cur+1),1000);
  } else {
    document.getElementById('o'+i).classList.add('wrong');
    fb.className='fb-box ng';fb.textContent='땡! 여길 지나갈 수 없다! (3초 후 재시도)';
    answered=false;
    let t=3;
    const iv=setInterval(()=>{
      t--;
      if(t>0){fb.textContent='땡! 여길 지나갈 수 없다! ('+t+'초 후 재시도)';}
      else{
        clearInterval(iv);
        document.querySelectorAll('.opt').forEach(o=>{o.classList.remove('disabled','wrong','correct')});
        fb.className='fb-box';fb.textContent='';
      }
    },1000);
  }
}

function buildFlip(g){
  let cards=[];
  g.pairs.forEach((p,i)=>{cards.push({id:'a'+i,txt:p.a,grp:i});cards.push({id:'b'+i,txt:p.b,grp:i})});
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]]}
  return `<div class="flipwrap"><div class="flip-notice">카드를 뒤집어 같은 쌍을 찾아라. 모두 맞추면 다음 관문으로.</div><div class="cgrid">${cards.map(c=>`<div class="fc" id="c_${c.id}" onclick="flip('${c.id}',${c.grp})"><div class="fi"><div class="ff">?</div><div class="fb">${c.txt.replace(/\n/g,'<br>')}</div></div></div>`).join('')}</div><div class="mdone" id="md">모든 짝을 맞췄다. 통과를 허하노라! ✓</div></div>`;
}
function flip(id,grp){
  if(locked)return;
  const el=document.getElementById('c_'+id);
  if(el.classList.contains('flipped')||el.classList.contains('matched'))return;
  el.classList.add('flipped');flipped.push({id,grp,el});
  if(flipped.length===2){
    locked=true;const[a,b]=flipped;
    if(a.grp===b.grp&&a.id!==b.id){
      setTimeout(()=>{a.el.classList.add('matched');b.el.classList.add('matched');flipped=[];locked=false;matched++;score+=5;updateHdr();
        if(matched===total){document.getElementById('md').classList.add('show');showConfetti();setTimeout(()=>moveNext(cur+1),1200)}
      },400);
    }else{setTimeout(()=>{a.el.classList.remove('flipped');b.el.classList.remove('flipped');flipped=[];locked=false},900)}
  }
}

function fmtNum(el){
  const raw=el.value.replace(/,/g,'').replace(/[^0-9]/g,'');
  if(raw===''){el.value='';return;}
  const pos=el.selectionStart;
  const prev=el.value.length;
  el.value=parseInt(raw,10).toLocaleString('ko-KR');
  const diff=el.value.length-prev;
  el.setSelectionRange(pos+diff,pos+diff);
}

function buildFill(g){
  const rows=g.scenario.map(s=>`<div class="srow2"><span class="sn">${s.n}</span><span class="sp">${s.p==='—'?'':s.p}</span></div>`).join('');
  const fields=g.fields.map((f,i)=>`<div class="frow"><span class="flbl">${f.l}</span><input type="text" class="finput" id="fi${i}" placeholder="입력" inputmode="numeric" oninput="fmtNum(this)"><span class="funit">원</span></div>`).join('');
  return `<div class="fcard"><div class="fq">아래 고객의 요즘가족결합 적용 후 월 청구 금액을 계산하시오.</div><div class="sbox">${rows}</div><div class="ffields">${fields}</div></div>`;
}
function submit(){
  if(answered)return;
  const g=gates[cur];let ok=true;
  g.fields.forEach((f,i)=>{const inp=document.getElementById('fi'+i),v=parseInt(inp.value.replace(/,/g,''));
    if(v===f.a)inp.classList.add('correct');else{inp.classList.add('wrong');ok=false}});
  const fb=document.getElementById('fbBox');
  if(ok){
    answered=true;
    document.getElementById('btnCheck').disabled=true;
    score+=20;updateHdr();
    showConfetti();
    fb.className='fb-box ok';fb.textContent='관문 통과! ✓';
    setTimeout(()=>moveNext(cur+1),1000);
  } else {
    fb.className='fb-box ng';fb.textContent='땡! 여길 지나갈 수 없다!';
    setTimeout(()=>{
      g.fields.forEach((_,i)=>{const inp=document.getElementById('fi'+i);inp.classList.remove('wrong','correct')});
      fb.className='fb-box';fb.innerHTML='';
    },2000);
  }
}
function showConfetti(){
  const wrap=document.getElementById('confettiWrap');
  wrap.innerHTML='';
  const colors=['#C4923A','#E8C97A','#fff','#1C2B5E','#E5682A'];
  for(let i=0;i<60;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.width=(8+Math.random()*8)+'px';
    p.style.height=(8+Math.random()*8)+'px';
    p.style.animationDuration=(.8+Math.random()*1.2)+'s';
    p.style.animationDelay=(Math.random()*.4)+'s';
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.innerHTML='',2500);
}

function moveNext(nextIdx){
  const isLast = nextIdx>=gates.length;
  if(isLast){
    document.getElementById('finalScore').textContent=score;
    show('clear');
  } else {
    load(nextIdx);
    window.scrollTo(0,0);
  }
}

function next(){
  if(cur+1>=gates.length){document.getElementById('finalScore').textContent=score;show('clear')}
  else{load(cur+1);window.scrollTo(0,0)}
}
</script>
